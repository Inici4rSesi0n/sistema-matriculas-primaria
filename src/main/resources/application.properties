spring.application.name=WiredAcademy
spring.profiles.active=dev

# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://${WIREDACADEMY_DB_HOST:localhost}:${WIREDACADEMY_DB_PORT:5433}/${WIREDACADEMY_DB_NAME:wiredacademy}
spring.datasource.username=${WIREDACADEMY_DB_USER:wiredacademy_app}
spring.datasource.password=${WIREDACADEMY_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# CONFIGURACIÓN DE FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
